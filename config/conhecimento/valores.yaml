# Tabela oficial de valores do Banco Exemplo. Todos os valores são fictícios.
#
# Única fonte de números nas respostas de conhecimento: os documentos citam as chaves
# como {{chave}} e o código preenche o valor depois da verificação; o LLM nunca
# escreve um número.
#
# Protótipo: este arquivo simula a tabela publicada. Em produção, os valores vêm do
# sistema de produtos e tarifas (ou de uma lista mantida pela área de produto, com
# aprovação), lidos por ferramenta de leitura; ninguém edita YAML. Mudança de valor
# vale sem reindexar documentos.
#
# tipo: reais (valor em texto, duas casas), percentual (ao mês) ou inteiro.

