<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%">
<style>
  text { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1f2937; }
  .t { font-size: 12.5px; font-weight: 600; }
  .s { font-size: 11px; fill: #374151; }
  .l { font-size: 10.5px; fill: #374151; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
  .b { font-size: 11px; font-weight: 600; fill: #4b5563; }
  .new { fill: #e8f0fb; stroke: #1f5fae; stroke-width: 1.4; }
  .llm { fill: #f1eafb; stroke: #6b3fa0; stroke-width: 1.4; }
  .exist { fill: #eef0f3; stroke: #8a8f98; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .ext { fill: #ffffff; stroke: #4b5563; stroke-width: 1.2; }
  .person { fill: #fff7e6; stroke: #b7791f; stroke-width: 1.2; }
  .bound { fill: none; stroke: #6b7280; stroke-width: 1.2; stroke-dasharray: 6 4; }
  .a { fill: none; stroke: #4b5563; stroke-width: 1.2; }
  .ad { fill: none; stroke: #4b5563; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .life { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 3; }
</style>
<defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
  </marker>
</defs>
<rect x="10" y="8" width="880" height="285" rx="8" class="bound"/><text x="20" y="23" class="b">② Agente (ADK no Agent Runtime)</text><rect x="560" y="14" width="14" height="10" rx="2" class="llm"/><text x="579" y="23" text-anchor="start" class="s">usa LLM</text><rect x="639" y="14" width="14" height="10" rx="2" class="new"/><text x="658" y="23" text-anchor="start" class="s">código determinístico</text><rect x="30" y="36" width="840" height="30" rx="6" class="new"/><text x="450.0" y="55.0" text-anchor="middle" class="t">Plugins do runner: Model Armor · observabilidade (OpenTelemetry) · emissor de auditoria</text><rect x="30" y="90" width="190" height="55" rx="6" class="llm"/><text x="125.0" y="114.5" text-anchor="middle" class="t">A. Classificador</text><text x="125.0" y="128.5" text-anchor="middle" class="s">saída estruturada, calibrada</text><rect x="260" y="90" width="300" height="55" rx="6" class="new"/><text x="410.0" y="107.5" text-anchor="middle" class="t">B. Orquestrador (grafo)</text><text x="410.0" y="121.5" text-anchor="middle" class="s">esclarecer · autenticar · confirmar</text><text x="410.0" y="135.5" text-anchor="middle" class="s">executar · responder · escalar</text><rect x="600" y="90" width="270" height="55" rx="6" class="new"/><text x="735.0" y="114.5" text-anchor="middle" class="t">H. Configuração versionada</text><text x="735.0" y="128.5" text-anchor="middle" class="s">instruções, persona, textos, critérios</text><rect x="30" y="175" width="250" height="60" rx="6" class="llm"/><text x="155.0" y="195.0" text-anchor="middle" class="t">C. Agente de conhecimento</text><text x="155.0" y="209.0" text-anchor="middle" class="s">cita fonte · recusa sem fonte</text><text x="155.0" y="223.0" text-anchor="middle" class="s">F. roteador Flash → Pro</text><rect x="310" y="175" width="270" height="60" rx="6" class="new"/><text x="445.0" y="195.0" text-anchor="middle" class="t">D. Subfluxo transacional</text><text x="445.0" y="209.0" text-anchor="middle" class="s">slots → política → confirmação</text><text x="445.0" y="223.0" text-anchor="middle" class="s">→ execução · textos fixos</text><rect x="610" y="175" width="260" height="60" rx="6" class="llm"/><text x="740.0" y="202.0" text-anchor="middle" class="t">E. Gestor de escalonamento</text><text x="740.0" y="216.0" text-anchor="middle" class="s">gatilhos + resumo para o atendente</text><rect x="30" y="252" width="840" height="32" rx="6" class="new"/><text x="450.0" y="272.0" text-anchor="middle" class="t">G. Registro de ferramentas — leitura: C, D, E · escrita: somente D → RAG Engine, Política, Servidores MCP</text><polyline points="220,117 260,117" class="a" marker-end="url(#m)"/><polyline points="330,145 330,160 155,160 155,175" class="a" marker-end="url(#m)"/><polyline points="445,145 445,175" class="a" marker-end="url(#m)"/><polyline points="520,145 520,160 740,160 740,175" class="a" marker-end="url(#m)"/><polyline points="155,235 155,252" class="a" marker-end="url(#m)"/><polyline points="445,235 445,252" class="a" marker-end="url(#m)"/><polyline points="740,235 740,252" class="a" marker-end="url(#m)"/></svg>