<rect x="40" y="8" width="200" height="40" rx="6" class="ext"/><text x="140.0" y="32.0" text-anchor="middle" class="t">WhatsApp (Meta + provedor)</text><rect x="255" y="8" width="140" height="40" rx="6" class="exist"/><text x="325.0" y="32.0" text-anchor="middle" class="t">App do banco</text><rect x="440" y="8" width="200" height="40" rx="6" class="ext"/><text x="540.0" y="25.0" text-anchor="middle" class="t">Plataforma de IA (Gemini)</text><text x="540.0" y="39.0" text-anchor="middle" class="s">global · sem identificadores</text><rect x="20" y="65" width="860" height="330" rx="8" class="bound"/><text x="30" y="80" class="b">Plataforma de atendimento</text><rect x="40" y="90" width="300" height="58" rx="6" class="new"/><text x="190.0" y="109.0" text-anchor="middle" class="t">① Gateway de canal · Cloud Run</text><text x="190.0" y="123.0" text-anchor="middle" class="s">dedup, identidade, mascaramento (SDP, SP),</text><text x="190.0" y="137.0" text-anchor="middle" class="s">roteador, botões, placeholders</text><rect x="600" y="90" width="260" height="58" rx="6" class="exist"/><text x="730.0" y="116.0" text-anchor="middle" class="t">Atendimento existente</text><text x="730.0" y="130.0" text-anchor="middle" class="s">bot ou fluxo legado</text><rect x="40" y="175" width="220" height="58" rx="6" class="new"/><text x="150.0" y="194.0" text-anchor="middle" class="t">⑥ Cofre de sessão · Firestore SP</text><text x="150.0" y="208.0" text-anchor="middle" class="s">token + dados reais · expira</text><text x="150.0" y="222.0" text-anchor="middle" class="s">IAM: só gateway e MCP</text><rect x="300" y="175" width="260" height="58" rx="6" class="new"/><text x="430.0" y="194.0" text-anchor="middle" class="t">② Agente · ADK no Agent Runtime</text><text x="430.0" y="208.0" text-anchor="middle" class="s">grafo com LLM nos nós</text><text x="430.0" y="222.0" text-anchor="middle" class="s">um por área de negócio</text><rect x="600" y="175" width="260" height="58" rx="6" class="new"/><text x="730.0" y="194.0" text-anchor="middle" class="t">⑧ Guardrails gerenciados</text><text x="730.0" y="208.0" text-anchor="middle" class="s">Model Armor (EUA),</text><text x="730.0" y="222.0" text-anchor="middle" class="s">sobre texto pseudonimizado</text><rect x="40" y="260" width="200" height="58" rx="6" class="new"/><text x="140.0" y="279.0" text-anchor="middle" class="t">③ Política · Cloud Run</text><text x="140.0" y="293.0" text-anchor="middle" class="s">catálogo assinado + piso</text><text x="140.0" y="307.0" text-anchor="middle" class="s">confirmação amarrada</text><rect x="260" y="260" width="200" height="58" rx="6" class="new"/><text x="360.0" y="279.0" text-anchor="middle" class="t">④ Conhecimento</text><text x="360.0" y="293.0" text-anchor="middle" class="s">RAG Engine SP + ingestão</text><text x="360.0" y="307.0" text-anchor="middle" class="s">cache semântico</text><rect x="480" y="260" width="200" height="58" rx="6" class="new"/><text x="580.0" y="279.0" text-anchor="middle" class="t">⑤ Servidores MCP · Cloud Run</text><text x="580.0" y="293.0" text-anchor="middle" class="s">um por domínio de sistema</text><text x="580.0" y="307.0" text-anchor="middle" class="s">em nome do cliente</text><rect x="40" y="335" width="420" height="45" rx="6" class="new"/><text x="250.0" y="354.5" text-anchor="middle" class="t">⑨ Auditoria (imutável) · Observabilidade (OTel) · Avaliação</text><text x="250.0" y="368.5" text-anchor="middle" class="s">todos os containers emitem traces e auditoria</text><rect x="700" y="335" width="160" height="45" rx="6" class="new"/><text x="780.0" y="354.5" text-anchor="middle" class="t">⑦ Registro de execuções</text><text x="780.0" y="368.5" text-anchor="middle" class="s">idempotência + outbox</text><rect x="40" y="420" width="180" height="50" rx="6" class="ext"/><text x="130.0" y="449.0" text-anchor="middle" class="t">Provedor de identidade</text><rect x="230" y="420" width="200" height="50" rx="6" class="ext"/><text x="330.0" y="442.0" text-anchor="middle" class="t">Monitoramento corporativo</text><text x="330.0" y="456.0" text-anchor="middle" class="s">(ex.: Dynatrace)</text><rect x="480" y="420" width="200" height="50" rx="6" class="ext"/><text x="580.0" y="442.0" text-anchor="middle" class="t">Sistemas do banco</text><text x="580.0" y="456.0" text-anchor="middle" class="s">cartões, tarifas, CRM, antifraude</text><rect x="700" y="420" width="160" height="50" rx="6" class="ext"/><text x="780.0" y="449.0" text-anchor="middle" class="t">Barramento de eventos</text><polyline points="140,48 140,90" class="a" marker-end="url(#m)"/><polyline points="325,48 325,90" class="a" marker-end="url(#m)"/><polyline points="340,119 600,119" class="a" marker-end="url(#m)"/><text x="440" y="113" text-anchor="middle" class="l">intenções não migradas</text><polyline points="520,175 520,48" class="a" marker-end="url(#m)"/><text x="526" y="82" text-anchor="start" class="l">texto pseudonimizado</text><polyline points="320,148 320,175" class="a" marker-end="url(#m)"/><text x="326" y="166" text-anchor="start" class="l">mensagem mascarada</text><polyline points="150,148 150,175" class="a" marker-end="url(#m)" marker-start="url(#m)"/><polyline points="560,204 600,204" class="a" marker-end="url(#m)" marker-start="url(#m)"/><polyline points="330,233 330,246 140,246 140,260" class="a" marker-end="url(#m)"/><text x="235" y="243" text-anchor="middle" class="l">pré-check</text><polyline points="400,233 400,260" class="a" marker-end="url(#m)"/><polyline points="530,233 530,260" class="a" marker-end="url(#m)"/><text x="536" y="252" text-anchor="start" class="l">ferramentas</text><polyline points="500,318 500,327 170,327 170,318" class="a" marker-end="url(#m)"/><text x="335" y="331" text-anchor="middle" class="l">aplica a política</text><polyline points="680,289 780,289 780,335" class="a" marker-end="url(#m)"/><polyline points="780,380 780,420" class="a" marker-end="url(#m)"/><polyline points="580,318 580,420" class="a" marker-end="url(#m)"/><text x="586" y="408" text-anchor="start" class="l">via gateway de APIs</text><polyline points="310,380 310,420" class="a" marker-end="url(#m)"/><text x="316" y="404" text-anchor="start" class="l">OTLP</text><polyline points="40,119 10,119 10,445 40,445" class="ad" marker-end="url(#m)"/><text x="6" y="285" text-anchor="middle" class="l" transform="rotate(-90 6 285)">token do cliente</text></svg>