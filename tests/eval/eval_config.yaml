# Métricas da avaliação (P5). Rode a partir da raiz do projeto: cada métrica carrega a
# função correspondente de tests/eval/metricas.py.
metrics_to_run:
  - comportamento
  - conteudo
  - chamadas_llm
  - fidelidade

custom_metrics:
  - name: comportamento
    custom_function: |
      import runpy
      evaluate = runpy.run_path("tests/eval/metricas.py")["comportamento"]
  - name: conteudo
    custom_function: |
      import runpy
      evaluate = runpy.run_path("tests/eval/metricas.py")["conteudo"]
  - name: chamadas_llm
    custom_function: |
      import runpy
      evaluate = runpy.run_path("tests/eval/metricas.py")["chamadas_llm"]
  - name: fidelidade
    # Juiz LLM (gemini-2.5-pro): só nas respostas com redação; ver juiz.py.
    custom_function_file: juiz.py
